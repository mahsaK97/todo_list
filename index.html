<!DOCTYPE html>
    <html lang="en">
    <head>
        <title> to do list</title>
        <meta charset="utf-8">
        <meta name="viewport"  content="width = device-width, initial-scale= 1.0">
        <meta name="description" content="to do list">
        <meta name="robots" content="index, follow">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <h1> todo list</h1>
    <label for="taskInput"> task </label>
    <input id="taskInput"
    type="text"
    placeholder="enter a task">
    <label for="categorySelector"> category:  </label>
    <select id="categorySelector">
        <option value="personal"> personal</option>
        <option value="study"> study </option>
        <option value="work"> work </option>
    </select>
    <label for="deadline"> Deadline</label>
    <input type="date"
    id="deadline"
    placeholder="enter the deadline">


    <button type="button" id="addButton">
        add
    </button>
    <label for="searchInput">search</label>
    <input id="searchInput" type="text" placeholder="search...">
    <button type="button" id="search_button"> search </button>
        <ul id="listTasks">

        </ul>

    <label for="exportbtn"></label>
    <button type="button" id="exportbtn"> Export to json</button>


    <div id="Pomodoro timer">

        <h2> Pomodoro Timer</h2>
        <div id="timer_displayer"> 25:00 </div>
        <div id="timer_mood"> Mood </div>

        <button id="start_timer"> Start </button>
        <button id="pause_timer"> Pause </button>
        <button id="reset_timer"> Reset </button>

    </div>

    <script src="script.js"></script>
    </body>
    </html>
